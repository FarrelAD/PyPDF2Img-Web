[phases.setup]
nixPkgs = ["poppler_utils", "postgresql"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput", "python manage.py migrate --noinput"]

[start]
cmd = "gunicorn pdf2img_web.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
